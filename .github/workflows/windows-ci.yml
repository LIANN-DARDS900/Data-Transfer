name: RoboTransfer Windows CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test — Windows / .NET 10
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore RoboTransfer.sln

      - name: Build Release
        run: dotnet build RoboTransfer.sln -c Release --no-restore

      - name: Run automated tests
        run: dotnet test RoboTransfer.sln -c Release --no-build --logger "console;verbosity=normal"
